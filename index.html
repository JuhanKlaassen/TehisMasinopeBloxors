<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bloxorz 3D & Custom Level Builder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-btn {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .glass-btn:hover:not(:disabled) {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .glass-btn.active-tool {
            background: rgba(79, 70, 229, 0.4) !important;
            border-color: #818cf8 !important;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
        }

        /* Blueprint Canvas Grid Cells */
        .blueprint-cell {
            width: 56px;
            height: 56px;
            min-width: 56px;
            min-height: 56px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .blueprint-cell:hover {
            border-color: rgba(129, 140, 248, 0.6);
            background-color: rgba(99, 102, 241, 0.15);
        }

        /* Custom Scrollbar for side panel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }

        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .dpad-btn {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="w-full h-full relative overflow-hidden">

    <!-- WebGL Canvas Container (3D Mode) -->
    <div id="webgl-container"></div>

    <!-- UI Header Bar & Mode Tabs -->
    <div class="absolute top-4 left-4 right-4 z-20 flex flex-col sm:flex-row justify-between items-center gap-4 pointer-events-none">
        <!-- Title & Mode Switcher -->
        <div class="glass-panel rounded-2xl px-5 py-2.5 flex items-center gap-4 pointer-events-auto shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid font-bold fa-cube text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide bg-gradient-to-r from-white via-indigo-100 to-indigo-300 bg-clip-text text-transparent">BLOXORZ 3D</h1>
                    <p class="text-[10px] text-indigo-300/70 font-medium">AI Solver & Blueprint Architect</p>
                </div>
            </div>
            
            <div class="h-8 w-[1px] bg-white/10 mx-1"></div>

            <!-- View Mode Tabs -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl border border-white/10">
                <button id="tab3D" class="px-4 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-cube"></i> 3D Play & AI
                </button>
                <button id="tabEditor" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex items-center gap-2">
                    <i class="fa-solid fa-drafting-compass"></i> Map Builder
                </button>
            </div>
        </div>

        <!-- Gameplay & Level Controls (3D Mode) -->
        <div id="gameControlsBar" class="glass-panel rounded-2xl px-6 py-2.5 flex items-center gap-6 pointer-events-auto shadow-2xl">
            <select id="levelSelect" class="bg-slate-900/90 text-indigo-200 border border-indigo-500/30 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-500 cursor-pointer transition">
                <!-- Populated dynamically -->
            </select>
            <div class="h-8 w-[1px] bg-white/10"></div>
            <div class="text-center">
                <span class="block text-[9px] uppercase tracking-wider text-slate-400 font-semibold">Moves</span>
                <span id="moveCounter" class="text-lg font-bold font-mono text-indigo-400">0</span>
            </div>
            <div class="h-8 w-[1px] bg-white/10"></div>
            <div class="text-center">
                <span class="block text-[9px] uppercase tracking-wider text-slate-400 font-semibold">Orientation</span>
                <span id="orientationBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 inline-block">Standing</span>
            </div>
            <div class="h-8 w-[1px] bg-white/10"></div>
            <button id="btnReset" class="glass-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i> Reset
            </button>
        </div>
    </div>

    <!-- AI SOLVER SIDE PANEL (3D Mode) -->
    <div id="aiSidePanel" class="absolute top-24 right-4 z-20 w-80 max-h-[calc(100vh-120px)] glass-panel rounded-2xl p-4 flex flex-col pointer-events-auto shadow-2xl transition-all">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-white/10">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-brain text-indigo-400 text-lg"></i>
                <h3 class="font-bold text-sm text-slate-100">Solver Engine</h3>
            </div>
            <span id="aiStatusTag" class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">Idle</span>
        </div>

        <!-- ALGORITHM TOGGLE SWITCH -->
        <div class="mb-3 bg-slate-900/90 p-1.5 rounded-xl border border-white/10">
            <label class="block text-[10px] font-bold text-slate-400 mb-1 px-1 uppercase tracking-wider">Algorithm Selection</label>
            <div class="grid grid-cols-3 gap-1 bg-slate-950 p-1 rounded-lg">
                <button id="algAStar" class="py-1 text-[10px] font-bold rounded-md bg-indigo-600 text-white transition">
                    A* (Original)
                </button>
                <button id="algMinimax" class="py-1 text-[10px] font-bold rounded-md text-slate-400 hover:text-white transition">
                    Minimax
                </button>
                <button id="algMinimaxV2" class="py-1 text-[10px] font-bold rounded-md text-slate-400 hover:text-white transition">
                    Minimax v2
                </button>
            </div>
        </div>

        <!-- MINIMAX DEPTH SLIDER CONTROL (Shown when Minimax or Minimax v2 selected) -->
        <div id="minimaxDepthControl" class="hidden mb-3 bg-slate-900/60 p-2 rounded-xl border border-white/5">
            <div class="flex items-center justify-between mb-1">
                <span class="text-[11px] text-slate-400 font-medium">Search Depth:</span>
                <span id="depthValue" class="text-[11px] font-mono font-bold text-indigo-300 w-8 text-right">35</span>
            </div>
            <input id="depthSlider" type="range" min="5" max="50" step="1" value="35" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <!-- AI Control Action Buttons -->
        <div class="grid grid-cols-2 gap-2 mb-3">
            <button id="btnSolve" class="col-span-2 py-2 px-3 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Compute Shortest Path
            </button>
            <button id="btnPlay" disabled class="py-1.5 px-3 rounded-xl text-xs font-semibold glass-btn text-emerald-400 disabled:opacity-40 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-play"></i> Auto Play
            </button>
            <button id="btnPause" disabled class="py-1.5 px-3 rounded-xl text-xs font-semibold glass-btn text-amber-400 disabled:opacity-40 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-pause"></i> Pause
            </button>
            <button id="btnStep" disabled class="col-span-2 py-1.5 px-3 rounded-xl text-xs font-semibold glass-btn text-indigo-300 disabled:opacity-40 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-forward-step"></i> Step Forward
            </button>
        </div>

        <!-- Speed Controls -->
        <div class="flex items-center justify-between bg-slate-900/60 p-2 rounded-xl mb-3 border border-white/5">
            <span class="text-[11px] text-slate-400 font-medium">Speed:</span>
            <input id="speedSlider" type="range" min="0.5" max="3" step="0.5" value="1" class="w-28 accent-indigo-500 cursor-pointer">
            <span id="speedValue" class="text-[11px] font-mono font-bold text-indigo-300 w-8 text-right">1.0x</span>
        </div>

        <!-- AI Solver Stats -->
        <div class="grid grid-cols-3 gap-2 mb-3 text-center">
            <div class="bg-slate-900/40 p-2 rounded-xl border border-white/5">
                <span class="block text-[9px] uppercase text-slate-500 font-bold">Steps</span>
                <span id="statPathLength" class="text-sm font-bold font-mono text-indigo-300">--</span>
            </div>
            <div class="bg-slate-900/40 p-2 rounded-xl border border-white/5">
                <span class="block text-[9px] uppercase text-slate-500 font-bold">Nodes</span>
                <span id="statNodesExplored" class="text-sm font-bold font-mono text-purple-300">--</span>
            </div>
            <div class="bg-slate-900/40 p-2 rounded-xl border border-white/5">
                <span class="block text-[9px] uppercase text-slate-500 font-bold">Time</span>
                <span id="statSolveTime" class="text-sm font-bold font-mono text-emerald-300">--</span>
            </div>
        </div>

        <!-- Solution Steps Queue -->
        <div class="flex-1 min-h-[140px] max-h-[220px] overflow-y-auto pr-1">
            <div id="solutionStepsContainer" class="flex flex-col gap-1">
                <div class="text-slate-500 text-center py-6 text-xs italic">
                    Click "Compute Shortest Path" to generate move sequence.
                </div>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN 2D MAP BLUEPRINT BUILDER MODE OVERLAY -->
    <div id="editorOverlay" class="fixed inset-0 z-30 bg-slate-950/95 flex flex-col hidden pt-20 pb-4 px-4">
        
        <!-- Blueprint Top Toolbar -->
        <div class="glass-panel rounded-2xl p-3 mb-3 flex flex-wrap items-center justify-between gap-3 shadow-2xl">
            <!-- Grid Dimensions & Zoom -->
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold text-slate-300 uppercase tracking-wider"><i class="fa-solid fa-ruler-combined text-indigo-400 mr-1"></i> Grid:</span>
                <div class="flex items-center gap-1.5">
                    <input id="editRows" type="number" min="5" max="20" value="10" class="w-12 bg-slate-900 text-center border border-slate-700 rounded-lg py-1 text-xs font-mono font-bold text-indigo-200">
                    <span class="text-slate-500 text-xs">x</span>
                    <input id="editCols" type="number" min="5" max="20" value="12" class="w-12 bg-slate-900 text-center border border-slate-700 rounded-lg py-1 text-xs font-mono font-bold text-indigo-200">
                    <button id="btnResizeGrid" class="glass-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-300 hover:text-white">Apply</button>
                </div>

                <div class="h-6 w-[1px] bg-white/10 hidden sm:block"></div>

                <!-- Zoom Controls for Large Grids -->
                <div class="flex items-center gap-1">
                    <button id="btnZoomOut" class="glass-btn w-7 h-7 rounded-lg text-xs flex items-center justify-center text-slate-300" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
                    <span id="zoomLevelText" class="text-xs font-mono text-indigo-300 px-1 font-bold">100%</span>
                    <button id="btnZoomIn" class="glass-btn w-7 h-7 rounded-lg text-xs flex items-center justify-center text-slate-300" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <!-- Tile Painting Palette (Keys 1-8) -->
            <div class="flex items-center gap-1.5 overflow-x-auto py-1">
                <button data-tool=" " class="palette-btn glass-btn active-tool px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 text-slate-400" title="Shortcut: 1">
                    <span class="font-mono text-[10px] px-1 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">1</span> Void
                </button>
                <button data-tool="." class="palette-btn glass-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 text-slate-200" title="Shortcut: 2">
                    <span class="font-mono text-[10px] px-1 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">2</span> Solid
                </button>
                <button data-tool="F" class="palette-btn glass-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 text-orange-400" title="Shortcut: 3">
                    <span class="font-mono text-[10px] px-1 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">3</span> Fragile
                </button>
                <button data-tool="O" class="palette-btn glass-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 text-cyan-400" title="Shortcut: 4">
                    <span class="font-mono text-[10px] px-1 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">4</span> Soft
                </button>
                <button data-tool="X" class="palette-btn glass-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 text-pink-400" title="Shortcut: 5">
                    <span class="font-mono text-[10px] px-1 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">5</span> Heavy
                </button>
                <button data-tool="B" class="palette-btn glass-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 text-slate-400" title="Shortcut: 6">
                    <span class="font-mono text-[10px] px-1 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">6</span> Bridge
                </button>
                <button data-tool="S" class="palette-btn glass-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 text-indigo-400" title="Shortcut: 7">
                    <span class="font-mono text-[10px] px-1 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">7</span> Start
                </button>
                <button data-tool="H" class="palette-btn glass-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 text-emerald-400" title="Shortcut: 8">
                    <span class="font-mono text-[10px] px-1 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">8</span> Goal
                </button>
            </div>

            <!-- Blueprint Export / Import / Actions -->
            <div class="flex items-center gap-2">
                <button id="btnExportJSON" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-indigo-300 hover:text-indigo-200" title="Export level configuration to JSON clipboard">
                    <i class="fa-solid fa-file-export mr-1"></i> Export
                </button>
                <button id="btnImportJSON" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-purple-300 hover:text-purple-200" title="Import level from JSON code">
                    <i class="fa-solid fa-file-import mr-1"></i> Import
                </button>
                <button id="btnClearGrid" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-rose-400 hover:text-rose-300">Clear</button>
                <button id="btnTestLevel" class="py-1.5 px-4 rounded-xl text-xs font-bold bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-600/30 flex items-center gap-1.5">
                    <i class="fa-solid fa-play"></i> Test 3D
                </button>
            </div>
        </div>

        <!-- Scrollable Viewport Container for Large Maps -->
        <div id="blueprintViewport" class="flex-1 relative bg-slate-950 rounded-2xl border border-indigo-500/20 overflow-auto flex items-start justify-start p-8 shadow-inner">
            <div id="blueprintScaleWrapper" class="m-auto transition-transform duration-150 origin-top-left">
                <div id="blueprintGridContainer" class="relative bg-slate-900/90 rounded-xl p-4 border border-indigo-500/30 shadow-2xl">
                    <!-- Large 2D Interactive Matrix Grid Generated Dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- On-Screen Touch D-Pad Controls for Mobile/Tablet -->
    <div id="touchDPad" class="absolute left-6 bottom-6 z-10 pointer-events-auto md:hidden flex flex-col items-center">
        <button id="btnUp" class="dpad-btn glass-btn w-12 h-12 rounded-2xl mb-1 flex items-center justify-center text-lg active:bg-indigo-600">
            <i class="fa-solid fa-chevron-up"></i>
        </button>
        <div class="flex gap-4">
            <button id="btnLeft" class="dpad-btn glass-btn w-12 h-12 rounded-2xl flex items-center justify-center text-lg active:bg-indigo-600">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button id="btnDown" class="dpad-btn glass-btn w-12 h-12 rounded-2xl flex items-center justify-center text-lg active:bg-indigo-600">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            <button id="btnRight" class="dpad-btn glass-btn w-12 h-12 rounded-2xl flex items-center justify-center text-lg active:bg-indigo-600">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Modal Box -->
    <div id="modalOverlay" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-filter backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full rounded-3xl p-6 text-center shadow-2xl border border-indigo-500/30 transform transition-all scale-95 opacity-0" id="modalCard">
            <div id="modalIconContainer" class="w-16 h-16 rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mx-auto flex items-center justify-center text-3xl mb-4 shadow-lg shadow-emerald-500/20">
                <i id="modalIcon" class="fa-solid fa-trophy"></i>
            </div>
            <h2 id="modalTitle" class="text-2xl font-bold mb-1 text-white">Stage Cleared!</h2>
            <p id="modalSubtext" class="text-sm text-slate-300 mb-6">You successfully slotted the block into the goal.</p>

            <div class="grid grid-cols-2 gap-3">
                <button id="btnModalRestart" class="glass-btn py-3 rounded-xl font-semibold text-sm">Retry Level</button>
                <button id="btnModalNext" class="py-3 rounded-xl font-semibold text-sm bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30">Next Level</button>
            </div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT GAME ENGINE -->
    <script>
        // Orientations
        const ORIENTATION = { STANDING: 0, HORIZONTAL: 1, VERTICAL: 2 };

        // Direction Rules
        const DIR = {
            UP: { dx: 0, dy: -1 },
            DOWN: { dx: 0, dy: 1 },
            LEFT: { dx: -1, dy: 0 },
            RIGHT: { dx: 1, dy: 0 }
        };

        // Algorithm Selection ("astar", "minimax", or "minimax_v2")
        let selectedAlgorithm = "astar";
        let minimaxMaxDepth = 35;

        // Application Global State
        let currentLevelIdx = 0;
        let currentLevel = null;
        let blockState = { x: 0, y: 0, orient: ORIENTATION.STANDING };
        let moveCount = 0;
        let isAnimating = false;
        let activeBridges = [];
        let orangeTilesBroken = new Set();

        // Level Editor Data Matrix & Blueprint Zoom
        let editorRows = 10;
        let editorCols = 12;
        let editorGrid = [];
        let activeTool = '.';
        let isMouseDownPainting = false;
        let customLevelCounter = 1;
        let blueprintZoom = 1.0;

        const PRESET_LEVELS = [
            {
                id: 1,
                name: "Stage 1: Genesis",
                start: { x: 1, y: 1 },
                grid: [
                    ".. ......",
                    ".........",
                    ".........",
                    "......H..",
                    ".........",
                    "  ......."
                ],
                switches: [],
                bridges: []
            },
            {
                id: 2,
                name: "Stage 2: Soft Touch",
                start: { x: 1, y: 2 },
                grid: [
                    "......  ",
                    "...O..  ",
                    "......  ",
                    "   .....",
                    "   ..H.."
                ],
                switches: [{ x: 3, y: 1, type: 'soft', targetBridges: [0] }],
                bridges: [{ x: 3, y: 3, active: false }]
            },
            {
                id: 3,
                name: "Stage 3: Fragile Step",
                start: { x: 1, y: 1 },
                grid: [
                    "....... ",
                    ".FFF... ",
                    ".F..H.. ",
                    "....... "
                ],
                switches: [],
                bridges: []
            },
            {
                id: 4,
                name: "Stage 4: Heavy Pressure",
                start: { x: 1, y: 1 },
                grid: [
                    ".....   ",
                    "..X..   ",
                    ".....   ",
                    "   .....",
                    "   ..H.."
                ],
                switches: [{ x: 2, y: 1, type: 'heavy', targetBridges: [0] }],
                bridges: [{ x: 3, y: 3, active: false }]
            },
            {
                id: 5,
                name: "Stage 5: Soft & Fragile",
                start: { x: 0, y: 1 },
                grid: [
                    "......  ",
                    ".O.F....",
                    "...F..H.",
                    "......  "
                ],
                switches: [{ x: 1, y: 1, type: 'soft', targetBridges: [0] }],
                bridges: [{ x: 4, y: 1, active: false }]
            },
            {
                id: 6,
                name: "Stage 6: The Dual Gate",
                start: { x: 1, y: 1 },
                grid: [
                    "......  ...",
                    ".O....  .H.",
                    "......  ...",
                    "   ....... ",
                    "   ...X... "
                ],
                switches: [

        // --- LEVEL LOADING & GRAPHICS ---
        function loadLevel(index) {

        function build3DLevelGraphics() {
            while (gridGroup.children.length > 0) {
                const child = gridGroup.children[0];
                gridGroup.remove(child);
                if (child.geometry) child.geometry.dispose();
            }
            bridgeMeshes = [];
            fragileMeshes = {};

            const tileGeo = new THREE.BoxGeometry(0.96, 0.4, 0.96);
            const normalMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4, metalness: 0.1 });
            const fragileMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.6, metalness: 0.1 });
            const switchSoftMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.3, metalness: 0.6 });
            const switchHeavyMat = new THREE.MeshStandardMaterial({ color: 0xec4899, roughness: 0.3, metalness: 0.6 });
            const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.5, transparent: true, opacity: 0.9 });

            for (let y = 0; y < currentLevel.grid.length; y++) {
                const row = currentLevel.grid[y];
                for (let x = 0; x < row.length; x++) {
                    const char = row[x];
                    if (char === ' ') continue; // Void

                    if (char === 'H') {
                        const holeGeo = new THREE.BoxGeometry(1.0, 0.4, 1.0);
                        const holeMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.2, wireframe: true });
                        const holeMesh = new THREE.Mesh(holeGeo, holeMat);
                        holeMesh.position.set(x, -0.2, y);
                        gridGroup.add(holeMesh);
                        continue;
                    }

                    let mat = normalMat;
                    if (char === 'F') mat = fragileMat;

                    const switchInfo = currentLevel.switches.find(s => s.x === x && s.y === y);
                    if (switchInfo) {
                        mat = switchInfo.type === 'soft' ? switchSoftMat : switchHeavyMat;
                    }

                    const mesh = new THREE.Mesh(tileGeo, mat);
                    mesh.position.set(x, -0.2, y);
                    mesh.receiveShadow = true;
                    mesh.castShadow = true;
                    gridGroup.add(mesh);

                    if (char === 'F') fragileMeshes[`${x},${y}`] = mesh;

                    if (switchInfo) {
                        const iconGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.05, 16);
                        const iconMat = new THREE.MeshStandardMaterial({ 
                            color: switchInfo.type === 'soft' ? 0x22d3ee : 0xf472b6, 
                            emissive: switchInfo.type === 'soft' ? 0x0891b2 : 0xdb2777,
                            emissiveIntensity: 0.6 
                        });
                        const iconMesh = new THREE.Mesh(iconGeo, iconMat);
                        iconMesh.position.set(x, 0.03, y);
                        gridGroup.add(iconMesh);
                    }
                }
            }

            if (currentLevel.bridges) {
                currentLevel.bridges.forEach((br, bIdx) => {
                    const mesh = new THREE.Mesh(tileGeo, bridgeMat);
                    mesh.position.set(br.x, -0.2, br.y);
                    mesh.visible = activeBridges[bIdx];
                    mesh.receiveShadow = true;
                    gridGroup.add(mesh);
                    bridgeMeshes.push(mesh);
                });
            }
        }

        // --- BLOCK STATE & PHYSICS ROTATION ---
        function updateBlockMeshPosition(animated = true) {
            const { x, y, orient } = blockState;
            let targetX = x, targetY = 0.98, targetZ = y;
            let rotX = 0, rotZ = 0;

            if (orient === ORIENTATION.HORIZONTAL) {
                targetX = x + 0.5;
                targetY = 0.48;
                rotZ = Math.PI / 2;
            } else if (orient === ORIENTATION.VERTICAL) {
                targetZ = y + 0.5;
                targetY = 0.48;
                rotX = Math.PI / 2;
            }

            blockMesh.position.set(targetX, targetY, targetZ);
            blockMesh.rotation.set(rotX, 0, rotZ);
        }

        function rollBlock(dir) {
            if (isAnimating) return;

            const nextState = getNextState(blockState, dir);
            isAnimating = true;

            const pivot = new THREE.Vector3();
            const axis = new THREE.Vector3();
            const angle = Math.PI / 2;
            const { x: bX, y: bY, orient } = blockState;

            if (dir === DIR.RIGHT) {
                axis.set(0, 0, -1);
                pivot.set(bX + (orient === ORIENTATION.HORIZONTAL ? 1.5 : 0.5), 0, bY);
            } else if (dir === DIR.LEFT) {
                axis.set(0, 0, 1);
                pivot.set(bX - 0.5, 0, bY);
            } else if (dir === DIR.DOWN) {
                axis.set(1, 0, 0);
                pivot.set(bX, 0, bY + (orient === ORIENTATION.VERTICAL ? 1.5 : 0.5));
            } else if (dir === DIR.UP) {
                axis.set(-1, 0, 0);
                pivot.set(bX, 0, bY - 0.5);
            }

            const startMatrix = blockMesh.matrix.clone();
            const duration = 180 / aiPlaySpeed;
            const startTime = performance.now();

            function animateRoll(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1.0);
                const currentAngle = angle * (progress * (2 - progress)); // easeOutQuad

                const rotationMatrix = new THREE.Matrix4().makeRotationAxis(axis, currentAngle);
                const translationMatrix = new THREE.Matrix4().makeTranslation(pivot.x, pivot.y, pivot.z);
                const invTranslationMatrix = new THREE.Matrix4().makeTranslation(-pivot.x, -pivot.y, -pivot.z);

                const finalMatrix = new THREE.Matrix4()
                    .multiply(translationMatrix)
                    .multiply(rotationMatrix)
                    .multiply(invTranslationMatrix)
                    .multiply(startMatrix);

                blockMesh.matrix.identity();
                blockMesh.matrix.multiply(finalMatrix);
                blockMesh.matrix.decompose(blockMesh.position, blockMesh.quaternion, blockMesh.scale);

                if (progress < 1.0) {
                    requestAnimationFrame(animateRoll);
                } else {
                    blockState = nextState;
                    moveCount++;
                    updateUIStats();
                    updateBlockMeshPosition(false);
                    checkBoardCollisions();
                    isAnimating = false;
                }
            }

            requestAnimationFrame(animateRoll);
        }

        function getNextState(state, dir) {
            const { x, y, orient } = state;
            let nx = x, ny = y, nOrient = orient;

            if (orient === ORIENTATION.STANDING) {
                if (dir === DIR.RIGHT) { nx = x + 1; ny = y; nOrient = ORIENTATION.HORIZONTAL; }
                else if (dir === DIR.LEFT) { nx = x - 2; ny = y; nOrient = ORIENTATION.HORIZONTAL; }
                else if (dir === DIR.DOWN) { nx = x; ny = y + 1; nOrient = ORIENTATION.VERTICAL; }
                else if (dir === DIR.UP) { nx = x; ny = y - 2; nOrient = ORIENTATION.VERTICAL; }
            } else if (orient === ORIENTATION.HORIZONTAL) {
                if (dir === DIR.RIGHT) { nx = x + 2; ny = y; nOrient = ORIENTATION.STANDING; }
                else if (dir === DIR.LEFT) { nx = x - 1; ny = y; nOrient = ORIENTATION.STANDING; }
                else if (dir === DIR.DOWN) { nx = x; ny = y + 1; nOrient = ORIENTATION.HORIZONTAL; }
                else if (dir === DIR.UP) { nx = x; ny = y - 1; nOrient = ORIENTATION.HORIZONTAL; }
            } else if (orient === ORIENTATION.VERTICAL) {
                if (dir === DIR.RIGHT) { nx = x + 1; ny = y; nOrient = ORIENTATION.VERTICAL; }
                else if (dir === DIR.LEFT) { nx = x - 1; ny = y; nOrient = ORIENTATION.VERTICAL; }
                else if (dir === DIR.DOWN) { nx = x; ny = y + 2; nOrient = ORIENTATION.STANDING; }
                else if (dir === DIR.UP) { nx = x; ny = y - 1; nOrient = ORIENTATION.STANDING; }
            }

            return { x: nx, y: ny, orient: nOrient };
        }

        function getOccupiedTiles(state) {
            const tiles = [{ x: state.x, y: state.y }];
            if (state.orient === ORIENTATION.HORIZONTAL) tiles.push({ x: state.x + 1, y: state.y });
            else if (state.orient === ORIENTATION.VERTICAL) tiles.push({ x: state.x, y: state.y + 1 });
            return tiles;
        }

        function checkBoardCollisions() {
            const tiles = getOccupiedTiles(blockState);
            
            let isValid = true;
            for (let tile of tiles) {
                if (!isTileSolid(tile.x, tile.y)) {
                    isValid = false;
                    break;
                }
            }

            if (blockState.orient === ORIENTATION.STANDING) {
                const char = getTileChar(blockState.x, blockState.y);
                if (char === 'F') {
                    isValid = false;
                    triggerTileBreak(blockState.x, blockState.y);
                }
            }

            if (!isValid) {
                triggerFallAnimation();
                return;
            }

            if (blockState.orient === ORIENTATION.STANDING) {
                const char = getTileChar(blockState.x, blockState.y);
                if (char === 'H') {
                    triggerWinSequence();
                    return;
                }
            }

            if (currentLevel.switches) {
                currentLevel.switches.forEach(sw => {
                    const isTouching = tiles.some(t => t.x === sw.x && t.y === sw.y);
                    if (isTouching) {
                        if (sw.type === 'soft' || (sw.type === 'heavy' && blockState.orient === ORIENTATION.STANDING)) {
                            toggleBridges(sw.targetBridges);
                        }
                    }
                });
            }
        }

        function isTileSolid(x, y) {
            const char = getTileChar(x, y);
            if (char === ' ' || char === null) return false;
            if (char === 'H') return true;

            if (char === 'B' && currentLevel.bridges) {
                const brIdx = currentLevel.bridges.findIndex(b => b.x === x && b.y === y);
                if (brIdx !== -1 && !activeBridges[brIdx]) return false;
            }

            if (orangeTilesBroken.has(`${x},${y}`)) return false;
            return true;
        }

        function getTileChar(x, y) {
            if (y < 0 || y >= currentLevel.grid.length) return null;
            const row = currentLevel.grid[y];
            if (x < 0 || x >= row.length) return null;

            if (currentLevel.bridges && currentLevel.bridges.some(b => b.x === x && b.y === y)) {
                return 'B';
            }
            return row[x];
        }

        function toggleBridges(bridgeIndices) {
            bridgeIndices.forEach(idx => {
                if (idx >= 0 && idx < activeBridges.length) {
                    activeBridges[idx] = !activeBridges[idx];
                    if (bridgeMeshes[idx]) bridgeMeshes[idx].visible = activeBridges[idx];
                }
            });
        }

        function triggerTileBreak(x, y) {
            orangeTilesBroken.add(`${x},${y}`);
            const mesh = fragileMeshes[`${x},${y}`];
            if (mesh) {
                mesh.position.y -= 1.0;
                mesh.visible = false;
            }
        }

        function triggerFallAnimation() {
            isAnimating = true;
            stopAutoPlay();

            const startY = blockMesh.position.y;
            const startTime = performance.now();

            function animateFall(now) {
                const elapsed = (now - startTime) / 1000;
                blockMesh.position.y = startY - 0.5 * 9.8 * elapsed * elapsed;
                blockMesh.rotation.x += 0.05;
                blockMesh.rotation.z += 0.05;

                if (elapsed < 0.6) {
                    requestAnimationFrame(animateFall);
                } else {
                    isAnimating = false;
                    showModal(false, "Block Fell Off Edge!", "Avoid voids and fragile orange tiles.");
                }
            }
            requestAnimationFrame(animateFall);
        }

        function triggerWinSequence() {
            stopAutoPlay();
            showModal(true, "Stage Cleared!", `Solved in ${moveCount} moves.`);
        }

        function paintCell(r, c) {
            const tool = typeof activeTool !== 'undefined' ? activeTool : '.';

            // Guarantee single Start position and Target Goal
            if (tool === 'S') {
                for (let i = 0; i < editorRows; i++) {
                    for (let j = 0; j < editorCols; j++) {
                        if (editorGrid[i][j] === 'S') editorGrid[i][j] = '.';
                    }
                }
            } else if (tool === 'H') {
                for (let i = 0; i < editorRows; i++) {
                    for (let j = 0; j < editorCols; j++) {
                        if (editorGrid[i][j] === 'H') editorGrid[i][j] = '.';
                    }
                }
            }

            editorGrid[r][c] = tool;
            renderBlueprintCanvasGrid();
        }

        function getCellBgClass(char) {
            switch (char) {
                case '.': return 'bg-slate-700/80 text-white hover:bg-slate-600';
                case ' ': return 'bg-slate-950/80 border-slate-800 text-slate-700';
                case 'F': return 'bg-orange-500 text-slate-950 border-orange-300';
                case 'O': return 'bg-cyan-500 text-slate-950 border-cyan-300';
                case 'X': return 'bg-pink-500 text-slate-950 border-pink-300';
                case 'B': return 'bg-slate-500 text-slate-950 border-slate-300';
                case 'S': return 'bg-emerald-500 text-slate-950 border-emerald-300 ring-2 ring-emerald-400/50';
                case 'H': return 'bg-rose-600 text-white border-rose-300 ring-2 ring-rose-500/50';
                default: return 'bg-slate-800';
            }
        }

        function getCellIcon(char) {
            switch (char) {
                case 'O': return 'O';
                case 'X': return 'X';
                case 'B': return 'B';

                case 'F': return '<i class="fa-solid fa-triangle-exclamation text-xs"></i>';

        // --- AI SOLVER ALGORITHM 1: ORIGINAL A* GRAPH SEARCH ---
        function solveLevelAStar() {
            const startTime = performance.now();
            setAIStatus("Solving A*...", "bg-amber-500/20 text-amber-300 border-amber-500/30");

            const startNode = {
                x: currentLevel.start.x,
                y: currentLevel.start.y,
                orient: ORIENTATION.STANDING,
                bridges: [...activeBridges],
                broken: new Set(),
                path: [],
                g: 0,
                h: 0
            };

            let targetHole = null;
            for (let y = 0; y < currentLevel.grid.length; y++) {
                for (let x = 0; x < currentLevel.grid[y].length; x++) {
                    if (currentLevel.grid[y][x] === 'H') {
                        targetHole = { x, y };
                        break;
                    }
                }
            }

            if (!targetHole) return;

            function getHeuristic(state) {
                return Math.abs(state.x - targetHole.x) + Math.abs(state.y - targetHole.y);
            }

            function getStateKey(s) {
                const bridgeKey = s.bridges.map(b => (b ? '1' : '0')).join('');
                return `${s.x},${s.y},${s.orient},${bridgeKey}`;
            }

            const openSet = [startNode];
            const closedSet = new Set();
            let nodesExplored = 0;
            let solutionNode = null;

            while (openSet.length > 0) {
                openSet.sort((a, b) => (a.g + a.h) - (b.g + b.h));
                const current = openSet.shift();
                nodesExplored++;

                if (current.orient === ORIENTATION.STANDING && current.x === targetHole.x && current.y === targetHole.y) {
                    solutionNode = current;
                    break;
                }

                const key = getStateKey(current);
                if (closedSet.has(key)) continue;
                closedSet.add(key);

                const directions = [
                    { dir: DIR.UP, label: 'UP' },
                    { dir: DIR.DOWN, label: 'DOWN' },
                    { dir: DIR.LEFT, label: 'LEFT' },
                    { dir: DIR.RIGHT, label: 'RIGHT' }
                ];

                for (let move of directions) {
                    const nextSim = getNextState(current, move.dir);
                    const occupied = getOccupiedTiles(nextSim);

                    let valid = true;
                    let nextBridges = [...current.bridges];
                    let nextBroken = new Set(current.broken);

                    for (let tile of occupied) {
                        const char = getTileChar(tile.x, tile.y);
                        if (char === ' ' || char === null) { valid = false; break; }
                        
                        if (char === 'B' && currentLevel.bridges) {
                            const brIdx = currentLevel.bridges.findIndex(b => b.x === tile.x && b.y === tile.y);
                            if (brIdx !== -1 && !nextBridges[brIdx]) { valid = false; break; }
                        }

                        if (nextBroken.has(`${tile.x},${tile.y}`)) { valid = false; break; }
                    }

                    if (!valid) continue;

                    if (nextSim.orient === ORIENTATION.STANDING) {
                        const char = getTileChar(nextSim.x, nextSim.y);
                        if (char === 'F') { valid = false; continue; }
                    }

                    if (currentLevel.switches) {
                        currentLevel.switches.forEach(sw => {
                            const isTouching = occupied.some(t => t.x === sw.x && t.y === sw.y);
                            if (isTouching) {
                                if (sw.type === 'soft' || (sw.type === 'heavy' && nextSim.orient === ORIENTATION.STANDING)) {
                                    sw.targetBridges.forEach(bIdx => {
                                        if (bIdx >= 0 && bIdx < nextBridges.length) {
                                            nextBridges[bIdx] = !nextBridges[bIdx];
                                        }
                                    });
                                }
                            }
                        });
                    }

                    const neighborNode = {
                        x: nextSim.x,
                        y: nextSim.y,
                        orient: nextSim.orient,
                        bridges: nextBridges,
                        broken: nextBroken,
                        path: [...current.path, { dir: move.dir, label: move.label }],
                        g: current.g + 1,
                        h: 0
                    };
                    neighborNode.h = getHeuristic(neighborNode);
                    openSet.push(neighborNode);
                }
            }

            const endTime = performance.now();
            const timeTaken = (endTime - startTime).toFixed(1);

            if (solutionNode) {
                aiSolutionPath = solutionNode.path;
                aiCurrentStep = 0;

                document.getElementById('statPathLength').innerText = aiSolutionPath.length;
                document.getElementById('statNodesExplored').innerText = nodesExplored;
                document.getElementById('statSolveTime').innerText = `${timeTaken}ms`;

            } else {

                document.getElementById('solutionStepsContainer').innerHTML = `
                    <div class="text-rose-400 text-center py-6 text-xs font-semibold">
                        No valid solution path exists for this map layout.
                    </div>
                `;
            }
        }

        // --- AI SOLVER ALGORITHM 2: CUSTOM MINIMAX ENGINE ---
        function solveLevelMinimax() {
            const startTime = performance.now();
            setAIStatus("Solving Minimax...", "bg-amber-500/20 text-amber-300 border-amber-500/30");

            let targetHole = null;
            for (let y = 0; y < currentLevel.grid.length; y++) {
                for (let x = 0; x < currentLevel.grid[y].length; x++) {
                    if (currentLevel.grid[y][x] === 'H') {
                        targetHole = { x, y };
                        break;
                    }
                }
            }

            if (!targetHole) return;

            const WIN_SCORE = 1000;
            const MAX_DEPTH = minimaxMaxDepth;
            const directions = [
                { dir: DIR.UP, label: 'UP' },
                { dir: DIR.DOWN, label: 'DOWN' },
                { dir: DIR.LEFT, label: 'LEFT' },
                { dir: DIR.RIGHT, label: 'RIGHT' }
            ];

            function evaluateState(state) {
                const occupied = getOccupiedTiles(state);
                const distances = occupied.map(c => Math.abs(c.x - targetHole.x) + Math.abs(c.y - targetHole.y));
                const minDistance = Math.min(...distances);
                return -(minDistance + (state.orient === ORIENTATION.STANDING ? 0 : 1));
            }

            function isWinState(state) {
                return state.orient === ORIENTATION.STANDING && state.x === targetHole.x && state.y === targetHole.y;
            }

            function getStateKey(s) {
                const bridgeKey = s.bridges ? s.bridges.map(b => (b ? '1' : '0')).join('') : '';
                return `${s.x},${s.y},${s.orient},${bridgeKey}`;
            }

            function getNextSimState(currState, dir) {
                const nextPos = getNextState(currState, dir);
                const occupied = getOccupiedTiles(nextPos);

                let valid = true;
                let nextBridges = [...currState.bridges];
                let nextBroken = new Set(currState.broken);

                for (let tile of occupied) {
                    const char = getTileChar(tile.x, tile.y);
                    if (char === ' ' || char === null) { valid = false; break; }
                    
                    if (char === 'B' && currentLevel.bridges) {
                        const brIdx = currentLevel.bridges.findIndex(b => b.x === tile.x && b.y === tile.y);
                        if (brIdx !== -1 && !nextBridges[brIdx]) { valid = false; break; }
                    }

                    if (nextBroken.has(`${tile.x},${tile.y}`)) { valid = false; break; }
                }

                if (!valid) return null;

                if (nextPos.orient === ORIENTATION.STANDING) {
                    const char = getTileChar(nextPos.x, nextPos.y);
                    if (char === 'F') return null; // Fragile tile breaks under standing block
                }

                if (currentLevel.switches) {
                    currentLevel.switches.forEach(sw => {
                        const isTouching = occupied.some(t => t.x === sw.x && t.y === sw.y);
                        if (isTouching) {
                            if (sw.type === 'soft' || (sw.type === 'heavy' && nextPos.orient === ORIENTATION.STANDING)) {
                                sw.targetBridges.forEach(bIdx => {
                                    if (bIdx >= 0 && bIdx < nextBridges.length) {
                                        nextBridges[bIdx] = !nextBridges[bIdx];
                                    }
                                });
                            }
                        }
                    });
                }

                return {
                    x: nextPos.x,
                    y: nextPos.y,
                    orient: nextPos.orient,
                    bridges: nextBridges,
                    broken: nextBroken
                };
            }

            let totalNodes = 0;
            let currentSimBlock = {
                x: blockState.x,
                y: blockState.y,
                orient: blockState.orient,
                bridges: [...activeBridges],
                broken: new Set(orangeTilesBroken)
            };
            let solutionMoves = [];

            // Execute iterative deepening search with switch/bridge simulation
            for (let step = 0; step < 100; step++) {
                if (isWinState(currentSimBlock)) break;

                let bestMoveForStep = null;
                let bestScoreForStep = -Infinity;
                let stepNodes = 0;

                for (let depth = 1; depth <= MAX_DEPTH; depth++) {
                    const ctx = {
                        alpha: -Infinity,
                        shallowestPly: new Map([[getStateKey(currentSimBlock), 0]]),
                        nodes: 1
                    };

                    let iterationBestMove = null;
                    let iterationBestScore = -Infinity;

                    for (let moveObj of directions) {
                        const nextState = getNextSimState(currentSimBlock, moveObj.dir);
                        if (!nextState) continue;

                        const score = maximizeMinimax(ctx, nextState, depth - 1, 1);
                        if (score > iterationBestScore) {
                            iterationBestScore = score;
                            iterationBestMove = moveObj;
                        }
                    }

                    stepNodes += ctx.nodes;
                    if (iterationBestMove) {
                        bestMoveForStep = iterationBestMove;
                        bestScoreForStep = iterationBestScore;
                    }

                    if (iterationBestScore > WIN_SCORE / 2) break; // Early exit on found goal path
                }

                totalNodes += stepNodes;

                if (!bestMoveForStep) break; // No valid moves

                solutionMoves.push(bestMoveForStep);
                currentSimBlock = getNextSimState(currentSimBlock, bestMoveForStep.dir);
            }

            function maximizeMinimax(ctx, state, depthLeft, ply) {
                if (ctx.alpha >= WIN_SCORE - ply) return -Infinity;

                const key = getStateKey(state);
                const seenAt = ctx.shallowestPly.get(key);
                if (seenAt !== undefined && seenAt <= ply) return -Infinity;
                ctx.shallowestPly.set(key, ply);
                ctx.nodes++;

                if (isWinState(state)) {
                    const winScore = WIN_SCORE - ply;
                    ctx.alpha = Math.max(ctx.alpha, winScore);
                    return winScore;
                }

                if (depthLeft === 0) {
                    const evalScore = evaluateState(state);
                    ctx.alpha = Math.max(ctx.alpha, evalScore);
                    return evalScore;
                }

                let bestVal = -Infinity;
                for (let moveObj of directions) {
                    const nextState = getNextSimState(state, moveObj.dir);
                    if (!nextState) continue;
                    bestVal = Math.max(bestVal, maximizeMinimax(ctx, nextState, depthLeft - 1, ply + 1));
                }
                return bestVal;
            }

            const endTime = performance.now();
            const timeTaken = (endTime - startTime).toFixed(1);

            if (solutionMoves.length > 0 && isWinState(currentSimBlock)) {
                aiSolutionPath = solutionMoves;
                aiCurrentStep = 0;

                document.getElementById('statPathLength').innerText = aiSolutionPath.length;
                document.getElementById('statNodesExplored').innerText = totalNodes;
                document.getElementById('statSolveTime').innerText = `${timeTaken}ms`;

                renderSolutionQueueUI();
                setAIStatus("Solved (Minimax)", "bg-emerald-500/20 text-emerald-300 border-emerald-500/30");
                
                document.getElementById('btnPlay').disabled = false;
                document.getElementById('btnStep').disabled = false;
            } else {
                setAIStatus("No Path Found", "bg-rose-500/20 text-rose-300 border-rose-500/30");
                document.getElementById('solutionStepsContainer').innerHTML = `
                    <div class="text-rose-400 text-center py-6 text-xs font-semibold">
                        Minimax could not locate a winning path for this map within max depth.
                    </div>
                `;
            }
        }

        function renderSolutionQueueUI() {
            const container = document.getElementById('solutionStepsContainer');
            container.innerHTML = '';

            aiSolutionPath.forEach((step, idx) => {
                const item = document.createElement('div');
                item.className = `px-3 py-1.5 rounded-lg flex items-center justify-between transition ${
                    idx === aiCurrentStep 
                        ? 'bg-indigo-600/40 border border-indigo-500/50 text-indigo-100 font-bold' 
                        : 'bg-slate-900/40 text-slate-400'
                }`;
                
                let iconClass = 'fa-arrow-up';
                if (step.label === 'DOWN') iconClass = 'fa-arrow-down';
                if (step.label === 'LEFT') iconClass = 'fa-arrow-left';
                if (step.label === 'RIGHT') iconClass = 'fa-arrow-right';

                item.innerHTML = `
                    <span class="text-[11px]">Step ${idx + 1}</span>
                    <span class="flex items-center gap-1.5 text-xs">
                        <i class="fa-solid ${iconClass}"></i> ${step.label}

        function highlightCurrentAIStep() {
            const container = document.getElementById('solutionStepsContainer');
            const items = container.children;
            for (let i = 0; i < items.length; i++) {
                if (i === aiCurrentStep) {
                    items[i].className = 'px-3 py-1.5 rounded-lg flex items-center justify-between bg-indigo-600/40 border border-indigo-500/50 text-indigo-100 font-bold';
                    items[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    items[i].className = 'px-3 py-1.5 rounded-lg flex items-center justify-between bg-slate-900/40 text-slate-400';
                }
            }
        }

        function executeAIStep() {
            if (aiCurrentStep >= aiSolutionPath.length || isAnimating) return;
            const step = aiSolutionPath[aiCurrentStep];
            rollBlock(step.dir);
            aiCurrentStep++;
            highlightCurrentAIStep();
            if (aiCurrentStep >= aiSolutionPath.length) stopAutoPlay();
        }

        function startAutoPlay() {
            if (aiAutoPlayTimer || aiCurrentStep >= aiSolutionPath.length) return;
            document.getElementById('btnPlay').disabled = true;
            document.getElementById('btnPause').disabled = false;

            aiAutoPlayTimer = setInterval(() => {
                if (!isAnimating) executeAIStep();
            }, 300 / aiPlaySpeed);
        }

        function stopAutoPlay() {
            if (aiAutoPlayTimer) {
                clearInterval(aiAutoPlayTimer);
                aiAutoPlayTimer = null;
            }
            document.getElementById('btnPlay').disabled = aiSolutionPath.length === 0 || aiCurrentStep >= aiSolutionPath.length;
            document.getElementById('btnPause').disabled = true;

                btn.addEventListener('click', () => {
                    paletteBtns.forEach(b => b.classList.remove('active-tool'));
                    btn.classList.add('active-tool');
                    activeTool = btn.getAttribute('data-tool');
                });
            });

            // Shortcut keys 1-8 for palette swapping
            window.addEventListener('keydown', (e) => {
                if (!editorOverlay || editorOverlay.classList.contains('hidden')) return;
                const toolKeys = {
                    '1': ' ',
                    '2': '.',
                    '3': 'F',
                    '4': 'O',
                    '5': 'X',
                    '6': 'B',
                    '7': 'S',
                    '8': 'H'
                };
                if (toolKeys[e.key] !== undefined) {
                    activeTool = toolKeys[e.key];
                    paletteBtns.forEach(b => {
                        b.classList.toggle('active-tool', b.getAttribute('data-tool') === activeTool);
                    });
                }
            });

            // Blueprint Grid Controls & Zooming
            addListener('btnResizeGrid', 'click', () => {
                const rEl = document.getElementById('editRows');
                const cEl = document.getElementById('editCols');
                editorRows = Math.min(Math.max(parseInt(rEl ? rEl.value : 8) || 8, 5), 20);
                editorCols = Math.min(Math.max(parseInt(cEl ? cEl.value : 10) || 10, 5), 20);
                initEditorGrid(editorRows, editorCols);
            });

            addListener('btnZoomIn', 'click', () => {
                blueprintZoom = Math.min(blueprintZoom + 0.15, 2.0);
                applyBlueprintZoom();
            });

            addListener('btnZoomOut', 'click', () => {
                blueprintZoom = Math.max(blueprintZoom - 0.15, 0.5);
                applyBlueprintZoom();
            });

            // Export and Import JSON Level Configuration
            addListener('btnExportJSON', 'click', exportLevelToClipboard);
            addListener('btnImportJSON', 'click', importLevelFromJSONPrompt);
            addListener('btnClearGrid', 'click', () => initEditorGrid(editorRows, editorCols));
            addListener('btnTestLevel', 'click', compileCustomLevelAndPlay);

            // Controls & Reset
            addListener('btnReset', 'click', () => loadLevel(currentLevelIdx));
            addListener('btnSolve', 'click', runSelectedSolver);
            addListener('btnPlay', 'click', startAutoPlay);
            addListener('btnPause', 'click', stopAutoPlay);
            addListener('btnStep', 'click', () => { stopAutoPlay(); executeAIStep(); });

            const speedSlider = document.getElementById('speedSlider');
            if (speedSlider) {
                speedSlider.addEventListener('input', (e) => {
                    aiPlaySpeed = parseFloat(e.target.value);
                    const speedVal = document.getElementById('speedValue');
                    if (speedVal) speedVal.innerText = `${aiPlaySpeed.toFixed(1)}x`;
                    if (aiAutoPlayTimer) { stopAutoPlay(); startAutoPlay(); }
                });
            }

            window.addEventListener('keydown', (e) => {
                if ((editorOverlay && !editorOverlay.classList.contains('hidden')) || isAnimating) return;
                switch (e.key) {
                    case 'ArrowUp': case 'w': case 'W': rollBlock(DIR.UP); break;
                    case 'ArrowDown': case 's': case 'S': rollBlock(DIR.DOWN); break;
                    case 'ArrowLeft': case 'a': case 'A': rollBlock(DIR.LEFT); break;
                    case 'ArrowRight': case 'd': case 'D': rollBlock(DIR.RIGHT); break;
                    case 'r': case 'R': loadLevel(currentLevelIdx); break;
                }
            });

            addListener('btnUp', 'click', () => rollBlock(DIR.UP));
            addListener('btnDown', 'click', () => rollBlock(DIR.DOWN));
            addListener('btnLeft', 'click', () => rollBlock(DIR.LEFT));
            addListener('btnRight', 'click', () => rollBlock(DIR.RIGHT));

            addListener('btnModalRestart', 'click', () => { hideModal(); loadLevel(currentLevelIdx); });
            addListener('btnModalNext', 'click', () => {
                hideModal();
                const nextIdx = (currentLevelIdx + 1) % PRESET_LEVELS.length;
                const lvlSel = document.getElementById('levelSelect');
                if (lvlSel) lvlSel.value = nextIdx;
                loadLevel(nextIdx);
            });
        }

        function applyBlueprintZoom() {
            const wrapper = document.getElementById('blueprintScaleWrapper');
            const zoomText = document.getElementById('zoomLevelText');
            if (wrapper) wrapper.style.transform = `scale(${blueprintZoom})`;
            if (zoomText) zoomText.innerText = `${Math.round(blueprintZoom * 100)}%`;
        }

        function exportLevelToClipboard() {
            const compiled = getCompiledBlueprintData();
            if (!compiled) return;

            const jsonStr = JSON.stringify(compiled, null, 2);
            
            const tempArea = document.createElement('textarea');
            tempArea.value = jsonStr;
            document.body.appendChild(tempArea);
            tempArea.select();
            try {
                document.execCommand('copy');
                alert("Level configuration copied to clipboard successfully!");
            } catch (err) {
                alert("Copied Level JSON:\n\n" + jsonStr);
            }
            document.body.removeChild(tempArea);
        }

        function importLevelFromJSONPrompt() {
            const jsonStr = prompt("Paste your custom Bloxorz level JSON configuration here:");
            if (!jsonStr) return;

            try {
                const lvl = JSON.parse(jsonStr);
                if (!lvl.grid || !lvl.start) {
                    alert("Invalid level data! Level must contain grid strings and a start position.");
                    return;
                }

                editorRows = lvl.grid.length;
                editorCols = Math.max(...lvl.grid.map(r => r.length));
                document.getElementById('editRows').value = editorRows;
                document.getElementById('editCols').value = editorCols;

                editorGrid = [];
                for (let r = 0; r < editorRows; r++) {
                    let row = [];
                    const line = lvl.grid[r] || "";
                    for (let c = 0; c < editorCols; c++) {
                        let char = line[c] || ' ';
                        if (lvl.start && lvl.start.x === c && lvl.start.y === r) char = 'S';
                        row.push(char);
                    }
                    editorGrid.push(row);
                }

                renderBlueprintCanvasGrid();
                alert(`Loaded level "${lvl.name || 'Custom'}" into editor blueprint!`);
            } catch (err) {
                alert("Failed to parse JSON level string. Check formatting.");
            }
        }

        function getCompiledBlueprintData() {
            let startPos = null;
            let goalPos = null;
            let switches = [];
            let bridges = [];

            let gridStrings = [];
            for (let r = 0; r < editorRows; r++) {
                let rowStr = "";
                for (let c = 0; c < editorCols; c++) {
                    let char = editorGrid[r][c];
                    if (char === 'S') {
                        startPos = { x: c, y: r };
                        rowStr += '.';
                    } else if (char === 'H') {
                        goalPos = { x: c, y: r };
                        rowStr += 'H';
                    } else if (char === 'O') {
                        switches.push({ x: c, y: r, type: 'soft', targetBridges: [], action: 'toggle' });
                        rowStr += '.';
                    } else if (char === 'X') {
                        switches.push({ x: c, y: r, type: 'heavy', targetBridges: [], action: 'toggle' });
                        rowStr += '.';
                    } else if (char === 'B') {
                        bridges.push({ x: c, y: r, active: false });
                        rowStr += ' ';
                    } else {
                        rowStr += char;
                    }
                }
                gridStrings.push(rowStr);
            }

            if (bridges.length > 0) {
                const bridgeIndices = bridges.map((_, i) => i);
                switches.forEach(sw => sw.targetBridges = bridgeIndices);
            }

            if (!startPos) {
                alert("Please place a Start Position (7) on the blueprint!");
                return null;
            }
            if (!goalPos) {
                alert("Please place a Goal Hole Target (8) on the blueprint!");
                return null;
            }

            return {
                id: PRESET_LEVELS.length + 1,
                name: `Custom Map #${customLevelCounter++}`,
                start: startPos,
                grid: gridStrings,
                switches: switches,
                bridges: bridges
            };
        }

        function compileCustomLevelAndPlay() {
            const customLevel = getCompiledBlueprintData();
            if (!customLevel) return;

            PRESET_LEVELS.push(customLevel);
            const select = document.getElementById('levelSelect');
            const opt = document.createElement('option');
            opt.value = PRESET_LEVELS.length - 1;
            opt.innerText = customLevel.name;
            select.appendChild(opt);
            select.value = PRESET_LEVELS.length - 1;

            document.getElementById('tab3D').click();
            loadLevel(PRESET_LEVELS.length - 1);
        }

        function updateUIStats() {
            document.getElementById('moveCounter').innerText = moveCount;
            const badge = document.getElementById('orientationBadge');
            if (blockState.orient === ORIENTATION.STANDING) {
                badge.innerText = 'Standing';
                badge.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 inline-block';
            } else if (blockState.orient === ORIENTATION.HORIZONTAL) {
                badge.innerText = 'Horizontal (X)';
                badge.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 inline-block';
            } else if (blockState.orient === ORIENTATION.VERTICAL) {
                badge.innerText = 'Vertical (Y)';
                badge.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 inline-block';
            }
        }

        function showModal(isWin, title, subtext) {
            const overlay = document.getElementById('modalOverlay');
            const card = document.getElementById('modalCard');
            const iconContainer = document.getElementById('modalIconContainer');
            const icon = document.getElementById('modalIcon');

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalSubtext').innerText = subtext;

            if (isWin) {
                iconContainer.className = 'w-16 h-16 rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mx-auto flex items-center justify-center text-3xl mb-4 shadow-lg shadow-emerald-500/20';
                icon.className = 'fa-solid fa-trophy';
            } else {
                iconContainer.className = 'w-16 h-16 rounded-2xl bg-rose-500/20 text-rose-400 border border-rose-500/30 mx-auto flex items-center justify-center text-3xl mb-4 shadow-lg shadow-rose-500/20';
                icon.className = 'fa-solid fa-skull';
            }

            overlay.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function hideModal() {
            const overlay = document.getElementById('modalOverlay');
            const card = document.getElementById('modalCard');

            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { overlay.classList.add('hidden'); }, 200);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
